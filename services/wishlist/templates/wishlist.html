<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Wishlist / Home Platform</title>
  <link rel="stylesheet" href="__BASE_PATH__/static/wishlist.css?v=__VERSION__">
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">Home Platform</div><h1 class="title">wishlist<span class="muted">.</span></h1></div>
      <div class="user" id="user"></div>
    </header>
    <section class="panel add-panel">
      <div class="label">Track something</div>
      <form class="add-form" id="add-form">
        <input id="url" type="url" placeholder="Shopify product URL" required>
        <input id="variant" maxlength="64" placeholder="Size (optional)">
        <input id="target" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Target">
        <button type="submit">TRACK</button>
      </form>
      <div class="message" id="message"></div>
    </section>
    <section class="panel list-panel">
      <div class="panel-head"><span class="panel-title">Tracked</span><button id="refresh" class="ghost" type="button">CHECK NOW</button></div>
      <div id="items" class="items"><div class="empty">Loading…</div></div>
    </section>
    <p class="footnote" id="footnote"></p>
  </main>
  <script>window.wishlistConfig=__WISHLIST_CONFIG__;</script>
  <script src="__BASE_PATH__/static/wishlist.js?v=__VERSION__" defer></script>
</body>
</html>
