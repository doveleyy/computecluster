name: home-platform-wishlist

services:
  wishlist:
    build:
      context: ../..
      dockerfile: services/wishlist/Dockerfile
    image: home-platform-wishlist:0.1.0
    container_name: home-platform-wishlist
    restart: unless-stopped
    user: "${SERVICE_UID:-1000}:${SERVICE_GID:-1000}"
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      WISHLIST_DB_PATH: /data/wishlist.db
      WISHLIST_BASE_PATH: /wishlist
      WISHLIST_TIMEZONE: Asia/Singapore
      WISHLIST_DISPLAY_CURRENCY: SGD
      WISHLIST_ALLOW_DEV_IDENTITY: "false"
      WISHLIST_IDENTITY_RESOLVER_URL: http://host.docker.internal:8000/internal/service-identities/resolve
      WISHLIST_IDENTITY_TOKEN_FILE: /run/secrets/service-identity-token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${WISHLIST_STATE_DIR:?Set the private state directory}:/data
      - ${WISHLIST_IDENTITY_TOKEN_FILE:?Set the private token file}:/run/secrets/service-identity-token:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/ready', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
