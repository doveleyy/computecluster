<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Water / Home Platform</title>
  <style>
    :root {
      color-scheme: dark; --bg:#050505; --raised:#121212; --line:#272727;
      --text:#f5f5f5; --muted:#8b8b8b; --dim:#5f5f5f; --water:#56d8ff;
      --danger:#ff6b6b; --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }
    *{box-sizing:border-box}[hidden]{display:none!important}html{background:var(--bg)}
    body{margin:0;min-width:280px;min-height:100dvh;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),var(--bg);background-size:32px 32px;color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}button{min-height:48px;border:1px solid var(--line);border-radius:9px;background:#0a0a0a;color:var(--text);cursor:pointer;touch-action:manipulation}button:hover{border-color:#555;background:var(--raised)}button:disabled{cursor:wait;opacity:.45}
    .shell{width:min(1240px,100%);margin:auto;padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(52px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
    .top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow,.label{color:var(--muted);font:600 10px var(--mono);letter-spacing:.13em;text-transform:uppercase}.title{margin:6px 0 0;font:600 clamp(26px,5vw,40px)/1 var(--mono);letter-spacing:-.06em}.user{color:var(--muted);font:11px var(--mono);text-align:right}
    .panel{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:rgba(10,10,10,.96)}.top-grid{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(340px,.88fr);gap:12px}
    .hero{display:flex;flex-direction:column;height:430px;padding:24px}.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.total{margin-top:12px;font:500 clamp(42px,8vw,72px)/.9 var(--mono);letter-spacing:-.08em}.unit{color:var(--dim);font-size:.35em;letter-spacing:-.03em}
    .goal-button{min-height:38px;padding:7px 10px;border-color:transparent;background:transparent;color:var(--muted);font:11px var(--mono);white-space:nowrap}.goal-button:hover{border-color:var(--line);background:#0d0d0d}.goal-button strong{color:var(--text);font-weight:600}.goal-edit{display:flex;align-items:center;gap:6px}.goal-edit input{width:84px;min-height:38px;padding:0 9px;border:1px solid var(--water);border-radius:8px;outline:0;background:#060606;color:var(--text);font:12px var(--mono)}.goal-edit button{min-height:38px;padding:0 10px;font:700 9px var(--mono);letter-spacing:.08em}
    .meter{height:5px;margin-top:22px;overflow:hidden;border-radius:9px;background:#252525}.fill{display:block;width:0;height:100%;background:var(--water);box-shadow:0 0 20px rgba(86,216,255,.45);transition:width .3s}
    .drink-picker{margin-top:20px}.type-options{display:flex;gap:6px;margin-top:9px;padding-bottom:4px;overflow-x:auto;scrollbar-width:thin}.type-options button,.choice-options button{min-height:36px;padding:0 11px;color:var(--muted);font:600 9px var(--mono);text-transform:uppercase}.type-options button{flex:0 0 auto}.type-options button.active{border-color:var(--kind,var(--water));background:color-mix(in srgb,var(--kind,var(--water)) 12%,#090909);color:var(--text)}
    .attributes{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}.attributes.with-sweetness{grid-template-columns:minmax(0,3fr) minmax(0,4fr)}.choice-group{min-width:0}.choice-options{display:grid;gap:6px;margin-top:7px}.choice-options button{width:100%}#temperature-options{grid-template-columns:repeat(3,minmax(0,1fr))}#sweetness-options{grid-template-columns:repeat(4,minmax(0,1fr))}.choice-options button.active{border-color:#666;background:#171717;color:var(--text)}
    .amount-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:15px}.quick{display:grid;grid-column:span 2;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.quick button{width:100%;font:700 11px var(--mono)}.custom{display:grid;grid-column:span 2;grid-template-columns:minmax(0,1fr) 58px;gap:8px}.custom input{width:100%;min-width:0;min-height:48px;padding:0 13px;border:1px solid var(--line);border-radius:9px;outline:0;background:#060606;color:var(--text);font:13px var(--mono)}.custom input:focus{border-color:var(--water)}.custom button{width:58px;padding:0;background:var(--text);color:var(--bg);font:700 10px var(--mono);letter-spacing:.08em}.message{min-height:18px;margin-top:9px;color:var(--muted);font:10px var(--mono)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto;padding:15px 17px;border-bottom:1px solid var(--line)}.panel-title{font:600 13px var(--mono)}.entries-panel{display:flex;flex-direction:column;min-height:0;height:430px}.entries{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#383838 transparent}.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 17px;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry-amount{font:600 12px var(--mono)}.entry-time{margin-top:4px;color:var(--muted);font:9px var(--mono)}.entry-details{color:var(--dim);text-transform:uppercase}
    .entry-kind,.mix-item{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font:9px var(--mono);text-transform:uppercase}.entry-kind{margin-left:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--kind,#777);box-shadow:0 0 9px color-mix(in srgb,var(--kind,#777) 55%,transparent)}.undo{min-height:34px;padding:0 10px;border-color:transparent;color:var(--dim);font:9px var(--mono)}.undo:hover{color:var(--danger)}.empty{padding:48px 17px;color:var(--muted);font:11px var(--mono);text-align:center}
    .analytics{margin-top:12px}.analytics-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);min-height:190px}.chart-block{padding:19px 20px 17px;border-right:1px solid var(--line)}.mix-block{padding:19px 20px}.section-caption{display:flex;align-items:center;justify-content:space-between;gap:12px}.history{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:8px;height:126px;margin-top:12px}.day{display:grid;grid-template-rows:1fr auto;align-items:end;gap:7px;height:100%;text-align:center}.bar-track{display:flex;height:100%;align-items:flex-end;background:#101010;border-radius:4px}.bar{display:block;width:100%;min-height:2px;border-radius:4px;background:var(--water);opacity:.78}.day-name{color:var(--dim);font:8px var(--mono);text-transform:uppercase}.mix-items{display:grid;gap:11px;margin-top:16px}.mix-item{justify-content:space-between}.mix-name{display:inline-flex;align-items:center;gap:7px}.mix-item strong{color:var(--text);font-weight:600}
    @media(max-width:720px){.shell{padding-left:12px;padding-right:12px}.top{align-items:flex-start}.user{max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top-grid{grid-template-columns:1fr}.hero{height:auto;min-height:0;padding:20px}.entries-panel{height:min(430px,58dvh)}.analytics-grid{grid-template-columns:1fr}.chart-block{border-right:0;border-bottom:1px solid var(--line)}.quick button{min-height:54px}}
    @media(max-width:560px){.attributes.with-sweetness{grid-template-columns:1fr}.amount-actions{grid-template-columns:1fr 1fr}.quick,.custom{grid-column:1/-1}}
    @media(max-width:430px){.hero-row{align-items:flex-start}.total{font-size:42px}.choice-options{gap:4px}.choice-options button{padding:0 7px}.custom{grid-template-columns:minmax(0,1fr) 58px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">Home Platform / Habits</div><h1 class="title">water<span style="color:var(--dim)">.</span></h1></div>
      <div class="user" id="user"></div>
    </header>
    <div class="top-grid">
      <section class="panel hero">
        <div class="hero-row">
          <div><div class="label">Today</div><div class="total"><span id="total">—</span><span class="unit"> ml</span></div></div>
          <button class="goal-button" id="goal-trigger" type="button" title="Change daily target">target <strong id="goal-value">—</strong> ml</button>
          <form class="goal-edit" id="goal-form" hidden><input id="goal-input" aria-label="Daily target in millilitres" type="number" min="250" max="10000" step="50" inputmode="numeric" required><button type="submit">SAVE</button></form>
        </div>
        <div class="meter"><span class="fill" id="fill"></span></div>
        <div class="drink-picker"><div class="label">Drink type</div><div class="type-options" id="drink-types"></div></div>
        <div class="attributes">
          <div class="choice-group"><div class="label">Temperature</div><div class="choice-options" id="temperature-options"><button type="button" data-temperature="hot">Hot</button><button type="button" data-temperature="normal">Normal</button><button type="button" data-temperature="iced">Iced</button></div></div>
          <div class="choice-group" id="sweetness-group" hidden><div class="label">Sweetness</div><div class="choice-options" id="sweetness-options"><button type="button" data-sweetness="none">None</button><button type="button" data-sweetness="less">Less</button><button type="button" data-sweetness="regular">Regular</button><button type="button" data-sweetness="extra">Extra</button></div></div>
        </div>
        <div class="amount-actions">
          <div class="quick"><button data-amount="250">+ 250 ml</button><button data-amount="500">+ 500 ml</button></div>
          <form class="custom" id="custom-form"><input id="custom-amount" type="number" min="10" max="2000" inputmode="numeric" placeholder="Custom ml" required><button type="submit">ADD</button></form>
        </div>
        <div class="message" id="message"></div>
      </section>
      <section class="panel entries-panel">
        <div class="panel-head"><span class="panel-title">Today’s drinks</span><span class="label" id="entry-count"></span></div>
        <div class="entries" id="entries"></div>
      </section>
    </div>
    <section class="panel analytics">
      <div class="panel-head"><span class="panel-title">Daily analysis</span><span class="label">Volume by day and type</span></div>
      <div class="analytics-grid">
        <div class="chart-block"><div class="section-caption"><span class="label">7 day rhythm</span><span class="label" id="timezone"></span></div><div class="history" id="history"></div></div>
        <div class="mix-block"><div class="label">Today’s mix</div><div class="mix-items" id="mix"><span class="mix-item">Nothing logged yet</span></div></div>
      </div>
    </section>
  </main>
  <script>
    const config=__WATER_TRACKER_CONFIG__;
    const api=path=>`${config.basePath}/api${path}`;
    const state={today:null,selectedType:'water',temperature:'normal',sweetness:'regular',editingGoal:false};
    const message=document.querySelector('#message');
    const typeMap=Object.fromEntries(config.drinkTypes.map(type=>[type.value,type.label]));
    const typeColors={water:'#56d8ff',supplement_water:'#8eeaff',coffee:'#d59b6a',tea:'#8bcf7b',milk:'#eee8d5',juice:'#ffb454',soft_drink:'#d68cff',sports_drink:'#62e6b5',alcohol:'#ff7474',other:'#9b9b9b'};
    const temperatureLabels={hot:'Hot',normal:'Normal',iced:'Iced'};
    const sweetnessLabels={none:'No sugar',less:'Less sweet',regular:'Regular sweet',extra:'Extra sweet'};
    document.querySelector('#user').textContent=config.displayName;
    document.querySelector('#timezone').textContent=config.timezone;
    async function request(path,options={}){const response=await fetch(api(path),{headers:{'Content-Type':'application/json'},...options});if(!response.ok){let detail=`Request failed (${response.status})`;try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}return response.status===204?null:response.json()}
    function busy(value){document.querySelectorAll('button').forEach(button=>{button.disabled=value})}
    function show(text,isError=false){message.textContent=text;message.style.color=isError?'var(--danger)':'var(--muted)'}
    function kindStyle(type){return `--kind:${typeColors[type]||typeColors.other}`}
    function renderTypes(){const root=document.querySelector('#drink-types');root.innerHTML='';for(const type of config.drinkTypes){const button=document.createElement('button');button.type='button';button.dataset.type=type.value;button.className=type.value===state.selectedType?'active':'';button.setAttribute('aria-pressed',String(type.value===state.selectedType));button.style.cssText=kindStyle(type.value);button.textContent=type.label;root.append(button)}const hasSweetness=['coffee','tea'].includes(state.selectedType);document.querySelector('#sweetness-group').hidden=!hasSweetness;document.querySelector('.attributes').classList.toggle('with-sweetness',hasSweetness)}
    function renderAttributes(){document.querySelectorAll('[data-temperature]').forEach(button=>{const active=button.dataset.temperature===state.temperature;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-sweetness]').forEach(button=>{const active=button.dataset.sweetness===state.sweetness;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))})}
    function renderMix(breakdown){const root=document.querySelector('#mix');root.innerHTML='';const values=Object.entries(breakdown).filter(([,amount])=>amount>0).sort((a,b)=>b[1]-a[1]);if(!values.length){root.innerHTML='<span class="mix-item">Nothing logged yet</span>';return}for(const[type,amount]of values){const item=document.createElement('span');item.className='mix-item';item.style.cssText=kindStyle(type);item.innerHTML=`<span class="mix-name"><span class="dot"></span>${typeMap[type]||'Other'}</span><strong>${amount.toLocaleString()} ml</strong>`;root.append(item)}}
    function renderToday(data){state.today=data;document.querySelector('#total').textContent=data.total_ml.toLocaleString();document.querySelector('#goal-value').textContent=data.goal_ml.toLocaleString();if(!state.editingGoal)document.querySelector('#goal-input').value=data.goal_ml;document.querySelector('#fill').style.width=`${Math.min(100,(data.total_ml/data.goal_ml)*100)}%`;document.querySelector('#entry-count').textContent=`${data.drinks.length} ${data.drinks.length===1?'entry':'entries'}`;renderMix(data.breakdown_ml);const entries=document.querySelector('#entries');entries.innerHTML='';if(!data.drinks.length){entries.innerHTML='<div class="empty">No drinks recorded yet.</div>';return}for(const drink of data.drinks){const row=document.createElement('div');row.className='entry';const localTime=new Date(drink.consumed_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const details=[temperatureLabels[drink.temperature]||'Normal'];if(drink.sweetness)details.push(sweetnessLabels[drink.sweetness]||drink.sweetness);row.innerHTML=`<div><div class="entry-amount">${drink.amount_ml} ml <span class="entry-kind" style="${kindStyle(drink.drink_type)}"><span class="dot"></span>${typeMap[drink.drink_type]||'Other'}</span></div><div class="entry-time">${localTime} <span class="entry-details">· ${details.join(' · ')}</span></div></div><button class="undo" data-delete="${drink.id}">UNDO</button>`;entries.append(row)}}
    function renderHistory(data){const root=document.querySelector('#history');root.innerHTML='';for(const day of data.days.slice(-7)){const date=new Date(`${day.date}T00:00:00`);const height=Math.min(100,(day.total_ml/day.goal_ml)*100);const cell=document.createElement('div');cell.className='day';cell.title=`${day.date}: ${day.total_ml} / ${day.goal_ml} ml`;cell.innerHTML=`<div class="bar-track"><span class="bar" style="height:${height}%"></span></div><span class="day-name">${date.toLocaleDateString([],{weekday:'narrow'})}</span>`;root.append(cell)}}
    function editGoal(editing){state.editingGoal=editing;document.querySelector('#goal-trigger').hidden=editing;document.querySelector('#goal-form').hidden=!editing;if(editing){const input=document.querySelector('#goal-input');input.value=state.today.goal_ml;input.focus();input.select()}}
    async function refresh(){const[today,history]=await Promise.all([request('/today'),request('/history?days=7')]);renderToday(today);renderHistory(history)}
    async function add(amount){busy(true);show('Saving…');const payload={amount_ml:Number(amount),drink_type:state.selectedType,temperature:state.temperature};if(['coffee','tea'].includes(state.selectedType))payload.sweetness=state.sweetness;try{await request('/drinks',{method:'POST',body:JSON.stringify(payload)});await refresh();show(`${typeMap[state.selectedType]} saved.`)}catch(error){show(error.message,true)}finally{busy(false)}}
    document.querySelector('#drink-types').addEventListener('click',event=>{const type=event.target.dataset.type;if(!type)return;state.selectedType=type;renderTypes()});
    document.querySelector('#temperature-options').addEventListener('click',event=>{const value=event.target.dataset.temperature;if(!value)return;state.temperature=value;renderAttributes()});
    document.querySelector('#sweetness-options').addEventListener('click',event=>{const value=event.target.dataset.sweetness;if(!value)return;state.sweetness=value;renderAttributes()});
    document.querySelectorAll('[data-amount]').forEach(button=>button.addEventListener('click',()=>add(button.dataset.amount)));
    document.querySelector('#custom-form').addEventListener('submit',event=>{event.preventDefault();const input=document.querySelector('#custom-amount');add(input.value).then(()=>{input.value=''})});
    document.querySelector('#goal-trigger').addEventListener('click',()=>editGoal(true));
    document.querySelector('#goal-input').addEventListener('keydown',event=>{if(event.key==='Escape')editGoal(false)});
    document.querySelector('#goal-form').addEventListener('submit',async event=>{event.preventDefault();busy(true);try{await request('/settings',{method:'PUT',body:JSON.stringify({daily_goal_ml:Number(document.querySelector('#goal-input').value)})});editGoal(false);await refresh();show('Daily target updated.')}catch(error){show(error.message,true)}finally{busy(false)}});
    document.querySelector('#entries').addEventListener('click',async event=>{const id=event.target.dataset.delete;if(!id)return;busy(true);try{await request(`/drinks/${id}`,{method:'DELETE'});await refresh();show('Entry removed.')}catch(error){show(error.message,true)}finally{busy(false)}});
    renderTypes();renderAttributes();refresh().catch(error=>show(error.message,true));
  </script>
</body>
</html>
