<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Transport</title>
  <link rel="stylesheet" href="__BASE_PATH__/static/transport.css?v=__VERSION__">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="system-mark" aria-hidden="true">
        <span class="network-bullet ns">NS</span>
        <span class="network-bullet ew">EW</span>
        <span class="network-bullet dt">DT</span>
      </div>
      <div class="masthead-copy">
        <p class="eyebrow">HOME PLATFORM / SINGAPORE</p>
        <h1>Transport</h1>
      </div>
      <time class="today" id="today"></time>
    </header>

    <section class="dashboard" aria-label="Transport information">
      <article class="board train-card">
        <header class="board-header">
          <div>
            <p class="board-code">01 / RAIL</p>
            <h2>Last train today</h2>
          </div>
          <button class="action-button" id="refresh-trains" type="button">Refresh timetable</button>
        </header>
        <p class="snapshot" id="train-snapshot">No timetable saved yet.</p>

        <div class="train-selectors">
          <label><span>Line</span>
            <select id="line" disabled><option>Refresh first</option></select>
          </label>
          <label><span>Direction of travel</span>
            <select id="direction" disabled><option>Select a line</option></select>
          </label>
          <label><span>Station</span>
            <select id="station" disabled><option>Select a direction</option></select>
          </label>
        </div>
        <button class="find-button" id="find-train" type="button" disabled>Show last train <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h17m-7-7 7 7-7 7"/></svg></button>

        <div class="train-result empty" id="train-result" aria-live="polite">
          <span>Choose a line, direction, and station.</span>
        </div>
      </article>

      <article class="board bus-card">
        <header class="board-header">
          <div>
            <p class="board-code">02 / BUS</p>
            <h2>My buses</h2>
          </div>
          <button class="action-button" id="refresh-buses" type="button">Refresh arrivals</button>
        </header>
        <p class="snapshot" id="bus-snapshot">Not refreshed.</p>

        <form id="bus-form" class="bus-form" novalidate>
          <label><span>Stop code</span>
            <input name="stop_code" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="05521" required>
          </label>
          <label><span>Bus service</span>
            <input name="service_no" maxlength="8" placeholder="121" required>
          </label>
          <label class="stop-name"><span>Stop name / nickname</span>
            <input name="stop_name" maxlength="80" placeholder="Maritime Hse" required>
          </label>
          <button class="save-button" type="submit">Save <span>+</span></button>
        </form>
        <p class="form-help">Stop codes have five digits, including leading zeroes.</p>

        <div class="bus-list" id="bus-list" aria-live="polite"></div>
      </article>
    </section>

  </main>
  <script>window.TRANSPORT_CONFIG = __TRANSPORT_CONFIG__;</script>
  <script src="__BASE_PATH__/static/transport.js?v=__VERSION__" defer></script>
</body>
</html>
