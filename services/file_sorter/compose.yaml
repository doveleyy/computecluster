name: home-platform-file-sorter

services:
  file-sorter:
    build:
      context: ../..
      dockerfile: services/file_sorter/Dockerfile
    image: home-platform-file-sorter:0.9.3
    container_name: home-platform-file-sorter
    restart: unless-stopped
    user: "${SERVICE_UID:-1000}:${SERVICE_GID:-1000}"
    ports:
      - "127.0.0.1:8103:8103"
    environment:
      SORTER_DB_PATH: /data/file_sorter.db
      SORTER_BASE_PATH: /sorter
      # Every dump and tree sits on this one mount, so each move is a
      # server-side rename. Projects pick folders inside it.
      SORTER_LIBRARY_DIR: /library
      # The first project, and the owner of rows from the pre-project schema.
      SORTER_SEED_NAME: Downloads
      SORTER_SEED_SOURCE: downloads_dump
      SORTER_SEED_TARGET: downloads_sorted
      SORTER_ADMIN_ACCOUNT_ID: ${SORTER_ADMIN_ACCOUNT_ID:?Set the administrator account ID}
      SORTER_ALLOW_DEV_IDENTITY: "false"
      SORTER_SESSION_URL: http://host.docker.internal:8000/jobs-ui/api/session
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${SORTER_STATE_DIR:?Set the private state directory}:/data
      - ${SORTER_LIBRARY_DIR:?Set the mounted personal library}:/library
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/ready', timeout=5).read()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
