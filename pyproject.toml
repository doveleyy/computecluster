[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["app", "worker", "contracts", "cli", "ops", "services"]
strict = true
warn_unreachable = true
