<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Apps · Home Platform</title>
  <style>
    :root { color-scheme:dark; --bg:#050505; --surface:#0a0a0a; --raised:#101010; --line:#242424; --strong:#383838; --text:#f3f3f3; --muted:#8b8b8b; --dim:#5d5d5d; --green:#4ce391; --cyan:#55d7ff; --yellow:#f2ca52; --red:#ff6666; --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
    * { box-sizing:border-box; }
    html { background:var(--bg); }
    body { margin:0; min-width:280px; min-height:100vh; min-height:100dvh; overflow-x:hidden; background:linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px),var(--bg); background-size:32px 32px; color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; touch-action:manipulation; }
    button:focus-visible,a:focus-visible,summary:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
    p { margin:0; overflow-wrap:anywhere; }
    .shell { width:min(1240px,100%); margin:0 auto; padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(52px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left)); }
    .topbar { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:26px; }
    .topbar > :first-child { min-width:0; flex:1; }
    .topbar .context-line { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .topbar-actions { flex-shrink:0; }
    .eyebrow,.kicker { color:var(--muted); font:600 10px/1.2 var(--mono); letter-spacing:.13em; text-transform:uppercase; }
    .brand { margin:5px 0 2px; font:600 clamp(24px,4vw,36px)/1 var(--mono); letter-spacing:-.06em; }
    .brand span { color:var(--dim); }
    .context-line { min-height:18px; margin-top:10px; color:var(--muted); font:12px/1.4 var(--mono); }
    .topbar-actions { display:flex; flex-direction:column; align-items:flex-end; gap:9px; }
    .topbar-button-row { display:flex; justify-content:flex-end; gap:7px; }
    .connection { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font:11px var(--mono); }
    .connection i { width:7px; height:7px; border-radius:50%; background:var(--yellow); box-shadow:0 0 12px currentColor; }
    .connection.live i { background:var(--green); }
    .page-nav { display:flex; flex-wrap:wrap; gap:4px; margin:0 0 18px; padding:4px; border:1px solid var(--line); border-radius:10px; background:rgba(8,8,8,.92); }
    .page-nav a { display:inline-grid; min-height:40px; padding:0 14px; place-items:center; border:1px solid transparent; border-radius:7px; color:var(--muted); font:600 11px var(--mono); letter-spacing:.04em; text-decoration:none; white-space:nowrap; }
    .page-nav a:hover { color:var(--text); }
    .page-nav a[aria-current="page"] { border-color:var(--strong); background:var(--raised); color:var(--text); }
    #status { margin:0 2px 18px; }
    #status:empty { display:none; }
    .ghost,.primary { border:1px solid var(--line); border-radius:8px; background:#090909; color:var(--muted); cursor:pointer; text-transform:uppercase; }
    .ghost { min-height:40px; padding:0 14px; font:11px var(--mono); }
    .ghost:hover:not(:disabled) { border-color:var(--strong); color:var(--text); }
    .primary { min-height:46px; padding:0 16px; border-color:var(--text); background:var(--text); color:var(--bg); font:700 11px var(--mono); letter-spacing:.08em; }
    button:disabled { cursor:not-allowed; opacity:.4; }
    .section-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:0 2px 9px; }
    .section-title { margin:4px 0 0; font:600 16px/1.2 var(--mono); letter-spacing:-.025em; }
    .count { color:var(--muted); font:11px var(--mono); white-space:nowrap; }
    .cards { display:grid; gap:12px; }
    .panel { --tone:var(--muted); min-width:0; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:rgba(10,10,10,.95); }
    .tone-green { --tone:var(--green); }
    .tone-cyan { --tone:var(--cyan); }
    .tone-yellow { --tone:var(--yellow); }
    .tone-red { --tone:var(--red); }
    .panel-header { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:62px; padding:14px 17px; border-bottom:1px solid var(--line); }
    .panel-header h3 { margin:0; font:600 14px/1.3 var(--mono); overflow-wrap:anywhere; }
    .panel-header > :first-child { min-width:0; }
    .app-id { margin-top:3px; color:var(--dim); font:10px var(--mono); overflow-wrap:anywhere; }
    .status { display:inline-flex; align-items:center; gap:6px; color:var(--tone); font:700 10px var(--mono); letter-spacing:.06em; white-space:nowrap; }
    .status::before { width:6px; height:6px; border-radius:50%; background:currentColor; content:""; }
    .card-body { display:grid; gap:8px; padding:16px 17px 17px; font:12px/1.55 var(--mono); }
    .line { font:13px/1.5 var(--mono); }
    .meta { color:var(--muted); font:11px/1.5 var(--mono); }
    .meta a,.card-body dd a { color:var(--text); text-decoration-color:var(--strong); text-underline-offset:3px; }
    .update { display:grid; gap:7px; margin:6px 0 2px; padding:13px 15px; border:1px solid var(--line); border-left:2px solid var(--tone); border-radius:8px; background:#080808; }
    .headline { font:600 13px/1.45 var(--mono); }
    .changes { color:var(--yellow); }
    ul.changes,.card-body details ul { margin:0; padding-left:18px; }
    .step { color:var(--muted); }
    .step.failed,.error { color:var(--red); }
    .actions { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:6px; }
    .service-link { display:inline-flex; min-height:36px; align-items:center; padding:0 11px; border:1px solid var(--strong); border-radius:7px; color:var(--text); font:700 9px var(--mono); letter-spacing:.08em; text-decoration:none; text-transform:uppercase; }
    .service-link:hover { border-color:var(--text); }
    .secondary { display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; }
    .activity { flex-basis:100%; color:var(--muted); font:12px/1.5 var(--mono); }
    .activity:empty { display:none; }
    .activity.progress { color:var(--cyan); }
    .activity.failed { color:var(--red); }
    details { margin-top:6px; border-top:1px solid var(--line); padding-top:12px; }
    summary { color:var(--muted); cursor:pointer; font:600 10px var(--mono); letter-spacing:.13em; text-transform:uppercase; }
    summary:hover { color:var(--text); }
    details[open] summary { margin-bottom:12px; }
    dl { display:grid; grid-template-columns:minmax(120px,190px) minmax(0,1fr); gap:1px; margin:0 0 12px; overflow:hidden; border:1px solid var(--line); border-radius:7px; background:var(--line); }
    dt,dd { min-width:0; margin:0; padding:9px; background:#080808; }
    dt { color:var(--dim); font:600 8px/16px var(--mono); letter-spacing:.1em; text-transform:uppercase; }
    dd { font:11px/1.5 var(--mono); overflow-wrap:anywhere; }
    dd a + a { margin-left:14px; }
    details .meta { margin-bottom:6px; }
    @media(max-width:640px) {
      .shell { padding-left:12px; padding-right:12px; }
      .topbar { align-items:flex-start; margin-bottom:20px; }
      .context-line { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      #status { max-width:none; white-space:normal; }
      .panel { border-radius:10px; }
      .panel-header { align-items:flex-start; padding:13px 14px; }
      .card-body { padding:14px; }
      .actions .primary { width:100%; }
      dl { grid-template-columns:1fr; gap:0; }
      dt { padding-bottom:0; border-top:1px solid var(--line); }
      dt:first-child { border-top:0; }
      dd { padding-top:2px; }
    }
    @media(max-width:390px) {
      .brand { font-size:22px; }
      .ghost { min-height:38px; padding:0 10px; }
    }
    @media(max-width:360px) {
      .topbar { display:block; }
      .topbar-actions { margin-top:14px; }
    }
  </style>
</head>
<body>
  <iframe class="platform-bar" src="/platform/bar?app=dashboard" title="Home Platform apps" style="display:block;width:100%;height:41px;border:0;flex:none;background:#070707"></iframe>
  <div class="shell">
    <header class="topbar"><div><div class="eyebrow">operator dashboard</div><h1 class="brand">HOME<span>//</span>CTRL</h1><div class="context-line">Releases, previews and deploys</div></div><div class="topbar-actions"><div id="connection" class="connection"><i></i><span id="updated">SYNCING</span></div><div class="topbar-button-row"><button id="refresh" class="ghost" type="button">Refresh</button><button id="logout" class="ghost" type="button">LOG OUT</button></div></div></header>
    <nav class="page-nav" aria-label="Home Platform"><a href="/dashboard">OVERVIEW</a><a href="/dashboard/operations">OPERATIONS</a><a href="/dashboard/apps" aria-current="page">APPS</a><a href="/dashboard/jobs">JOBS</a><a href="/dashboard/files">FILES</a></nav>
    <div id="status" class="context-line" role="status"></div>
    <main class="section" aria-labelledby="apps-title"><header class="section-heading"><div><div class="kicker">managed apps</div><h2 id="apps-title" class="section-title">Applications</h2></div><span id="count" class="count">—</span></header><div id="apps" class="cards"></div></main>
  </div>
<script>
let csrf='';const status=document.getElementById('status');const connection=document.getElementById('connection');const root=document.getElementById('apps');const node=(tag,text,className)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(className)n.className=className;return n};
const words=value=>value.replaceAll('_',' ');
const link=(text,url)=>{const a=node('a',text);a.href=url;a.target='_blank';a.rel='noopener';return a};
const HEADLINE=[['ERROR','red',c=>c.app.error],['NEEDS RECOVERY','red',c=>c.blocked],['IN PROGRESS','cyan',c=>c.running],['SETTINGS CHANGE','yellow',c=>c.settingsOnly],['RESTORE READY','yellow',c=>c.restorable],['UPDATE READY','yellow',c=>c.app.pending&&!c.retired],['RUNNING','green',c=>c.app.running],['RETIRED','muted',c=>c.retired],['NOT INSTALLED','muted',()=>true]];
const plural=(n,word)=>n+' '+word+(n===1?'':'s');const ownRelease=app=>app.lifecycle==='retired'&&app.pending&&app.pending.digest===app.retired.release.digest;
const PRIMARY={preview:['Preview','preview','Previewing on staging…'],previewing:['Check preview','preview','Checking the preview…'],preview_failed:['Preview again','preview','Previewing on staging…'],check_compatibility:['Check compatibility','preview','Checking compatibility…'],compatibility_failed:['Check compatibility again','preview','Checking compatibility…'],approve:['Approve and deploy','deploy','Requesting deploy…']};
const cards=new Map(),nodes=new Map(),inflight=new Map(),notes=new Map(),refocus=new Map(),confirming=new Set();let timer=null,watchedSince=0,polling=false,loads=0,signedOut=false;
function live(ok,message=''){connection.classList.toggle('live',ok);document.getElementById('updated').textContent=ok?'Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'OFFLINE';status.textContent=message;}
async function get(url){const response=await fetch(url);if(response.status===401)signedOut=true;if(!response.ok)throw Error(response.status===401?'Sign in from the dashboard to manage apps.':'Apps are unavailable.');return response.json();}
async function load(){const seq=++loads;try{const data=await get('/dashboard/api/apps');if(seq!==loads)return;csrf=data.csrf;place(data.apps);const retired=data.apps.filter(app=>app.lifecycle==='retired').length;document.getElementById('count').textContent=plural(data.apps.length,'app')+' · '+plural(data.apps.filter(app=>app.pending&&!ownRelease(app)).length,'update')+(retired?' · '+retired+' retired':'');live(true);}catch(error){live(false,error.message);}schedule();}
function place(apps){const ids=new Set(apps.map(app=>app.app_id));for(const [id,element] of nodes)if(!ids.has(id)){element.remove();nodes.delete(id);cards.delete(id);}let previous=null;for(const app of apps){const element=patch(app);if(element.previousElementSibling!==previous)previous?previous.after(element):root.prepend(element);previous=element;}}
function patch(app){const id=app.app_id;cards.set(id,app);const key=JSON.stringify([app,inflight.get(id)??null,notes.get(id)??null,confirming.has(id)]);const old=nodes.get(id);if(old&&old.dataset.key===key)return old;const next=card(app);next.dataset.key=key;nodes.set(id,next);if(!old){root.append(next);return next;}
const details=old.querySelector('details');if(details)next.querySelector('details').open=details.open;const focused=old.contains(document.activeElement)?document.activeElement.dataset.focus:refocus.get(id);old.replaceWith(next);
if(focused&&document.activeElement===document.body){const target=next.querySelector('[data-focus="'+CSS.escape(focused)+'"]');if(target&&!target.disabled){target.focus();refocus.delete(id);}else if(target)refocus.set(id,focused);else refocus.delete(id);}return next;}
const watching=()=>!signedOut&&(inflight.size>0||[...cards.values()].some(app=>app.activity&&!app.activity.final));
function schedule(){clearTimeout(timer);timer=null;if(!watching()){watchedSince=0;return;}if(document.hidden)return;watchedSince||=Date.now();timer=setTimeout(poll,Date.now()-watchedSince<10000?2000:5000);}
async function poll(){if(polling)return;polling=true;clearTimeout(timer);timer=null;try{const activity=await get('/dashboard/api/apps/activity');live(true);const changed=[];let settled=false;for(const app of cards.values()){const next=activity[app.app_id]??null;if(JSON.stringify(next)===JSON.stringify(app.activity))continue;if(app.activity&&!app.activity.final&&(!next||next.final))settled=true;changed.push({...app,activity:next});}if(settled)await load();else changed.forEach(patch);}catch(error){live(false,error.message);}finally{polling=false;}schedule();}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);timer=null;}else if(watching())poll();});
async function act(app,action,release,sending){const id=app.app_id;inflight.set(id,sending);notes.delete(id);watchedSince=Date.now();patch(cards.get(id));schedule();try{const response=await fetch('/dashboard/api/apps/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({app_id:id,digest:release.digest,preview_id:release.preview_id||null,rehearsal_id:release.rehearsal_id||null,registration_sha256:release.registration_sha256||null,request_id:crypto.randomUUID()})});const result=await response.json().catch(()=>({}));if(!response.ok)throw Error(typeof result.detail==='string'?result.detail:'Request failed with HTTP '+response.status+'.');}catch(error){notes.set(id,error.message);}inflight.delete(id);patch(cards.get(id));await load();}
const stamp=value=>new Date(value).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});const size=bytes=>(bytes<1048576?(bytes/1024).toFixed(1)+' KiB':(bytes/1048576).toFixed(1)+' MiB')+' ('+bytes.toLocaleString()+' bytes)';
function confirmRetire(app,open){const id=app.app_id;open?confirming.add(id):confirming.delete(id);patch(app);const target=nodes.get(id).querySelector('[data-focus="'+(open?'cancel-retire:Cancel':'retire:Retire')+'"]');if(target)target.focus();}
function summary(prefix,release,suffix=''){const line=node('p',prefix+(release.version||release.commit.slice(0,7))+(release.title?' — '+release.title:'')+suffix);const meta=node('p','','meta');const when=release.committed_at&&new Date(release.committed_at);if(when&&!isNaN(when))meta.append('pushed '+stamp(when)+' · ');const sha=link(release.commit.slice(0,7),release.commit_url);sha.title='Release SHA-256 '+release.digest+'\nCommit '+release.commit;meta.append(sha);return [line,meta];}
function card(app){const pending=app.pending;const ops=app.operations;const activity=app.activity;const blocked=Boolean(activity&&activity.active&&activity.final);const running=Boolean(activity&&activity.active&&!activity.final);const sending=inflight.get(app.app_id);const locked=blocked||running||sending!==undefined;const settingsOnly=Boolean(pending)&&pending.digest===app.installed;const retired=app.lifecycle==='retired';const restorable=retired&&Boolean(pending)&&!ownRelease(app);
const [state,tone]=HEADLINE.find(([,,matches])=>matches({app,blocked,running,settingsOnly,retired,restorable}));const article=node('article','','panel tone-'+tone);article.dataset.appId=app.app_id;const header=node('header','','panel-header');const name=node('div');name.append(node('h3',app.label),node('div',app.app_id,'app-id'));header.append(name,node('span',state,'status'));const body=node('div','','card-body');article.append(header,body);if(app.error)body.append(node('p',app.error,'error'));
const button=(parent,label,action,release,disabled=locked,className='ghost',text=label+'…')=>{const b=node('button',label,className);b.type='button';b.disabled=disabled;b.dataset.focus=action+':'+label;b.onclick=()=>act(app,action,release,text);parent.append(b);return b;};
if(app.running){const [line,meta]=summary('Running ',app.running,pending?'':' · Up to date');line.className='line';body.append(line,meta);if(app.restart_notice)body.append(node('p',app.restart_notice,'changes'));}else if(app.retired){const [line,meta]=summary('Retired '+stamp(app.retired.retired_at)+' · last ran ',app.retired.release);line.className='line';body.append(line,meta);}else if(!app.error)body.append(node('p',pending?'Not installed':'Not installed · no release found yet','line'));
if(pending){const update=node('section','','update');if(settingsOnly)update.append(node('p','Settings change','headline'));else{const [headline,meta]=summary(retired?'Restore ready: ':'Update ready: ',pending.release);headline.className='headline';update.append(headline,meta);if(pending.settings_change.length)update.append(node('p','Settings change, applied with this update:','changes'));}if(pending.settings_change.length){const list=node('ul','','changes');for(const item of pending.settings_change)list.append(node('li',item));update.append(list);}const changes=[...pending.added_capabilities.map(n=>'adds capability '+n),...pending.added_secrets.map(n=>'adds secret '+n)];if(changes.length)update.append(node('p','Changes: '+changes.join(' · '),'changes'));update.append(node('p',pending.status,pending.policy_mismatch||pending.step.endsWith('failed')?'step failed':'step'));const actions=node('div','','actions');const primary=retired&&pending.step==='approve'?['Approve and restore','deploy','Requesting restore…']:PRIMARY[pending.step];if(primary)button(actions,primary[0],primary[1],pending,locked||pending.policy_mismatch||(primary[1]==='deploy'&&(!pending.rehearsal_id||pending.preview_state!=='ready')),'primary',primary[2]);if(pending.preview_url){const preview=link('Open preview',pending.preview_url);preview.className='service-link';preview.dataset.focus='open-preview';actions.append(preview);}if(actions.childElementCount)update.append(actions);body.append(update);}
const secondary=node('div','','secondary');button(secondary,'Check for updates','check',{digest:app.installed||'0'.repeat(64)},locked,'ghost','Checking for updates…');if(pending)button(secondary,'Reject','reject',pending,locked,'ghost','Rejecting…');if(app.rollback)button(secondary,'Rollback','rollback',app.rollback,locked||app.rollback.policy_mismatch,'ghost','Requesting rollback…');const blockedOperation=ops.find(o=>o.state==='blocked');if(blocked&&blockedOperation)button(secondary,'Recover','recover',blockedOperation,Boolean(app.recover_notice)||sending!==undefined,'ghost','Requesting recovery…');const confirm=app.retire&&!app.retire.notice&&!locked&&confirming.has(app.app_id);if(app.retire){const retire=button(secondary,'Retire','retire',app.retire,locked||Boolean(app.retire.notice));retire.setAttribute('aria-expanded',String(confirm));retire.onclick=()=>confirmRetire(app,!confirm);}
const note=notes.get(app.app_id);const [lineText,lineTone]=sending?[sending,'progress']:note?[note,'failed']:activity?[activity.text,activity.tone]:['',''];const line=node('p',lineText,'activity '+lineTone);line.setAttribute('role','status');secondary.append(line);body.append(secondary);if(confirm){const section=node('section','','update tone-red');section.append(node('p','Retiring stops '+app.label+', removes its container and host units, and takes a verified final archive of its database.'),node('p','Kept: the database, its settings and credential, and its releases for a restore. Until then it leaves Home and its pages answer "Application is retired".','meta'));const row=node('div','','actions');button(row,'Retire '+app.label,'retire',app.retire,false,'primary').onclick=()=>{confirming.delete(app.app_id);act(app,'retire',app.retire,'Requesting retire…');};button(row,'Cancel','cancel-retire',null,false).onclick=()=>confirmRetire(app,false);section.append(row);body.append(section);}if(app.rollback&&app.rollback.notice&&!locked)body.append(node('p',app.rollback.notice,'meta'));if(app.retire&&app.retire.notice&&!locked)body.append(node('p',app.retire.notice,'meta'));if(app.recover_notice)body.append(node('p',app.recover_notice,'meta'));
const details=node('details');const toggle=node('summary','Technical details');toggle.dataset.focus='details';details.append(toggle);const dl=node('dl');const row=(key,value)=>{const dd=node('dd');dd.append(value);dl.append(node('dt',key),dd);};row('Installed',app.installed||(retired?'Retired':'Not installed'));if(app.retired){const archive=app.retired.archive;row('Last installed',app.retired.release.digest);row('Last installed commit',app.retired.release.commit);if(archive){row('Final archive',archive.file_name);row('Archive SHA-256',archive.sha256);row('Content SHA-256',archive.content_sha256);row('Archive tables',archive.tables.length+' · '+archive.tables.join(', '));row('Archive size',size(archive.size_bytes));}else row('Final archive','None, the app keeps no database');}if(app.running)row('Installed commit',app.running.commit);row('Installed uses',app.installed_capabilities.join(', ')||'None');row('Installed secrets',app.installed_secrets.join(', ')||'None');row('Settings',app.settings.join(', ')||'None');
if(pending){row('Pending',pending.digest);if(pending.registration_sha256)row('Pending registration',pending.registration_sha256);for(const [key,value] of pending.proposed_bindings)row(key,value);row('Pending commit',pending.release.commit);row('Image',pending.image);row('Capabilities',pending.capabilities.join(', ')||'None');row('Secret bindings',pending.secrets.join(', ')||'None');row('Preview',pending.preview_state||'Not checked');row('Compatibility',pending.rehearsal_id?'Passed':'Not checked');row('Preview checks',Object.entries(pending.preview_checks).map(([name,passed])=>words(name)+': '+(passed?'passed':'failed')).join(', ')||'Not checked');const links=node('span');for(const [label,url] of [['Source',pending.release.commit_url],['Workflow',pending.workflow_url],['Open preview',pending.preview_url]])if(url)links.append(link(label,url));row('Release',links);}
details.append(dl);if(ops.length){details.append(node('p','Recent operations','meta'));const list=node('ul');for(const operation of ops){const li=node('li',operation.kind+' · '+operation.state+(operation.error?' · '+words(operation.error)+(operation.error==='policy_refused'?". Update this app's host policy entry to match the registration and the release's maintenance and state, then approve it again.":''):'')+(operation.reconcile_error?' · not reconciled since '+operation.reconcile_failed_at+': '+operation.reconcile_error:''));if(operation.error||operation.reconcile_error)li.className='error';list.append(li);}details.append(list);}body.append(details);return article;}
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await fetch('/dashboard/logout',{method:'POST'});location.href='/dashboard';};load();
</script></body></html>
