<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps · Home Platform</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101112;color:#eee}*{box-sizing:border-box}body{max-width:1000px;margin:0 auto;padding:28px 20px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#a4d5ff}h1{font-size:26px;margin:32px 0 20px}h2{margin:0 0 12px;font-size:20px}article{border:1px solid #363a3e;border-radius:12px;margin:18px 0;padding:22px;background:#191b1e}p{margin:0 0 6px;overflow-wrap:anywhere}.line{font-size:16px}.meta{color:#a9afb5;font-size:13px;margin-bottom:14px}.update{border-left:3px solid #4d9de0;padding:2px 0 2px 14px;margin:16px 0}.headline{font-size:17px;font-weight:600}.changes{color:#ffd27a;font-size:14px}.status{font-size:14px;margin-top:10px}.status.failed,.error{color:#ffa49c}button{font:inherit;color:inherit;background:#30363c;border:1px solid #59616a;border-radius:7px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#2b6cb0;border-color:#4d9de0;font-weight:600}.actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:14px}.secondary{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.secondary button{background:none;font-size:13px;padding:6px 10px;color:#c8ced4}details{margin-top:18px;font-size:14px}summary{cursor:pointer;color:#a9afb5}dl{display:grid;grid-template-columns:140px 1fr;gap:10px;margin:14px 0}dt{color:#a9afb5}dd{margin:0;overflow-wrap:anywhere}dd a{margin-right:16px}[role=status]{min-height:24px;margin:20px 0}ul{padding-left:18px} @media(max-width:480px){dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:8px}article{padding:16px}.actions button.primary{width:100%}}
</style></head><body><nav><a href="/dashboard">Overview</a><a href="/dashboard/operations">Operations</a><a href="/dashboard/jobs">Jobs</a><a href="/dashboard/files">Files</a><a href="/dashboard/apps" aria-current="page">Apps</a></nav><h1>Apps</h1><button id="refresh">Refresh</button><div id="status" role="status"></div><main id="apps"></main>
<script>
let csrf='';const status=document.getElementById('status');const node=(tag,text,className)=>{const n=document.createElement(tag);if(text)n.textContent=text;if(className)n.className=className;return n};
const words=value=>value.replaceAll('_',' ');
const link=(text,url)=>{const a=node('a',text);a.href=url;a.target='_blank';a.rel='noopener';return a};
const PRIMARY={preview:['Preview','preview'],previewing:['Check preview','preview'],preview_failed:['Preview again','preview'],check_compatibility:['Check compatibility','preview'],compatibility_failed:['Check compatibility again','preview'],approve:['Approve and deploy','deploy']};
async function load(){try{const response=await fetch('/dashboard/api/apps');if(!response.ok)throw Error(response.status===401?'Sign in from the dashboard to manage apps.':'Apps are unavailable.');const data=await response.json();csrf=data.csrf;document.getElementById('apps').replaceChildren(...data.apps.map(card));}catch(error){status.textContent=error.message;}}
function summary(prefix,release,suffix=''){const line=node('p',prefix+(release.version||release.commit.slice(0,7))+(release.title?' — '+release.title:'')+suffix);const meta=node('p','','meta');const when=release.committed_at&&new Date(release.committed_at);if(when&&!isNaN(when))meta.append('pushed '+when.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})+' · ');const sha=link(release.commit.slice(0,7),release.commit_url);sha.title='Release SHA-256 '+release.digest+'\nCommit '+release.commit;meta.append(sha);return [line,meta];}
function card(app){const article=node('article');article.append(node('h2',app.label));if(app.error)article.append(node('p',app.error,'error'));const pending=app.pending;const ops=app.operations;const blocked=ops.find(o=>o.state==='blocked');const running=ops.find(o=>o.state==='queued'||o.state==='switching');const active=Boolean(blocked||running);
const button=(parent,label,action,release,disabled=active,className)=>{const b=node('button',label,className);b.disabled=disabled;b.onclick=async()=>{b.disabled=true;status.textContent='Working…';try{const response=await fetch('/dashboard/api/apps/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({app_id:app.app_id,digest:release.digest,preview_id:release.preview_id||null,rehearsal_id:release.rehearsal_id||null,registration_sha256:release.registration_sha256||null,request_id:crypto.randomUUID()})});const result=await response.json();if(!response.ok)throw Error(result.detail);status.textContent=result.state==='queued'?'Request queued. Refresh to see the result.':result.state;await load();}catch(error){status.textContent=error.message;b.disabled=false;}};parent.append(b);};
if(app.running){const [line,meta]=summary('Running ',app.running,pending?'':' · Up to date');line.className='line';article.append(line,meta);if(app.restart_notice)article.append(node('p',app.restart_notice,'changes'));}else if(!app.error)article.append(node('p',pending?'Not installed':'Not installed · no release found yet','line'));
if(pending){const update=node('section','','update');const settingsOnly=pending.digest===app.installed;if(settingsOnly)update.append(node('p','Settings change','headline'));else{const [headline,meta]=summary('Update ready: ',pending.release);headline.className='headline';update.append(headline,meta);if(pending.settings_change.length)update.append(node('p','Settings change, applied with this update:','changes'));}if(pending.settings_change.length){const list=node('ul','','changes');for(const item of pending.settings_change)list.append(node('li',item));update.append(list);}const changes=[...pending.added_capabilities.map(n=>'adds capability '+n),...pending.added_secrets.map(n=>'adds secret '+n)];if(changes.length)update.append(node('p','Changes: '+changes.join(' · '),'changes'));update.append(node('p',pending.status,pending.policy_mismatch||pending.step.endsWith('failed')?'status failed':'status'));const actions=node('div','','actions');const primary=PRIMARY[pending.step];if(primary)button(actions,primary[0],primary[1],pending,active||pending.policy_mismatch||(primary[1]==='deploy'&&(!pending.rehearsal_id||pending.preview_state!=='ready')),'primary');if(pending.preview_url)actions.append(link('Open preview',pending.preview_url));if(actions.childElementCount)update.append(actions);article.append(update);}
if(blocked)article.append(node('p','Needs recovery'+(blocked.error?': '+words(blocked.error):''),'error'));else if(running)article.append(node('p',running.kind[0].toUpperCase()+running.kind.slice(1)+' in progress…','status'));const last=ops[0];if(last&&last.state==='failed'&&last.kind!=='rehearse')article.append(node('p','Last '+last.kind+' failed'+(last.error?': '+words(last.error):''),'error'));for(const operation of ops)if(operation.reconcile_error)article.append(node('p',operation.kind+' not reconciled since '+operation.reconcile_failed_at+': '+operation.reconcile_error,'error'));
const secondary=node('div','','secondary');button(secondary,'Check for updates','check',{digest:app.installed||'0'.repeat(64)});if(pending)button(secondary,'Reject','reject',pending);if(app.rollback)button(secondary,'Rollback','rollback',app.rollback,active||app.rollback.policy_mismatch);if(blocked)button(secondary,'Recover','recover',blocked,Boolean(app.recover_notice));article.append(secondary);if(app.rollback&&app.rollback.notice&&!active)article.append(node('p',app.rollback.notice,'meta'));if(app.recover_notice)article.append(node('p',app.recover_notice,'meta'));
const details=node('details');details.append(node('summary','Technical details'));const dl=node('dl');const row=(key,value)=>{const dd=node('dd');dd.append(value);dl.append(node('dt',key),dd);};row('Installed',app.installed||'Not installed');if(app.running)row('Installed commit',app.running.commit);row('Installed uses',app.installed_capabilities.join(', ')||'None');row('Installed secrets',app.installed_secrets.join(', ')||'None');row('Settings',app.settings.join(', ')||'None');
if(pending){row('Pending',pending.digest);if(pending.registration_sha256)row('Pending registration',pending.registration_sha256);for(const [key,value] of pending.proposed_bindings)row(key,value);row('Pending commit',pending.release.commit);row('Image',pending.image);row('Capabilities',pending.capabilities.join(', ')||'None');row('Secret bindings',pending.secrets.join(', ')||'None');row('Preview',pending.preview_state||'Not checked');row('Compatibility',pending.rehearsal_id?'Passed':'Not checked');row('Preview checks',Object.entries(pending.preview_checks).map(([name,passed])=>words(name)+': '+(passed?'passed':'failed')).join(', ')||'Not checked');const links=node('span');for(const [label,url] of [['Source',pending.release.commit_url],['Workflow',pending.workflow_url],['Open preview',pending.preview_url]])if(url)links.append(link(label,url));row('Release',links);}
details.append(dl);if(ops.length){details.append(node('p','Recent operations','meta'));const list=node('ul');for(const operation of ops){const li=node('li',operation.kind+' · '+operation.state+(operation.error?' · '+words(operation.error)+(operation.error==='policy_refused'?". Update this app's host policy entry to match the registration and the release's maintenance and state, then approve it again.":''):'')+(operation.reconcile_error?' · not reconciled since '+operation.reconcile_failed_at+': '+operation.reconcile_error:''));if(operation.error||operation.reconcile_error)li.className='error';list.append(li);}details.append(list);}article.append(details);return article;}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
